[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "streamlit-coco"
version = "0.1.0"
description = "Streamlit component and Python library for Snowflake CoCo (Cortex Code)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "streamlit-coco contributors" }]
keywords = ["streamlit", "snowflake", "coco", "cortex", "agent", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "streamlit>=1.53",
]

[project.optional-dependencies]
sdk = ["cortex-code-agent-sdk>=1.0.2"]
dev = [
    "cortex-code-agent-sdk>=1.0.2",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "pip-audit>=2.7",
]

[project.urls]
Homepage = "https://github.com/DevoteamSP/streamlit-coco"
Documentation = "https://github.com/DevoteamSP/streamlit-coco#readme"
Repository = "https://github.com/DevoteamSP/streamlit-coco"
Issues = "https://github.com/DevoteamSP/streamlit-coco/issues"
Changelog = "https://github.com/DevoteamSP/streamlit-coco/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["streamlit_coco"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.cursor",
    "/.agents",
    "/.claude",
    "/.git",
    "/.github",
    "/.venv",
    "/tmp",
    "/dist",
    "/.pytest_cache",
    "/.ruff_cache",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "streamlit-coco"
version = "0.3.0"
description = "Streamlit component and Python library for Snowflake CoCo (Cortex Code)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "streamlit-coco contributors" }]
keywords = ["streamlit", "snowflake", "coco", "cortex", "agent", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # st.popover(key=), used by copilot_rail since 0.1.8, is new in 1.55; the browser tests pass on 1.55.0
    "streamlit>=1.55",
]

[project.optional-dependencies]
sdk = ["snowflake-cortex-agent-sdk>=0.0.3,<0.1"]
dev = [
    "snowflake-cortex-agent-sdk>=0.0.3,<0.1",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "pip-audit>=2.7",
    "pbixray>=0.15.4",
]
e2e = [
    "streamlit-coco[dev]",
    "pytest-playwright>=0.6",
]

[project.urls]
# Temporary: personal release repo until DevoteamSP is PyPI-validated (see doc/deployment/publish.md).
Homepage = "https://github.com/lletourmy/streamlit-coco"
Documentation = "https://github.com/lletourmy/streamlit-coco#readme"
Repository = "https://github.com/lletourmy/streamlit-coco"
Issues = "https://github.com/lletourmy/streamlit-coco/issues"
Changelog = "https://github.com/lletourmy/streamlit-coco/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["streamlit_coco"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.cursor",
    "/.agents",
    "/.claude",
    "/.git",
    "/.github",
    "/.venv",
    "/tmp",
    "/dist",
    "/uv.lock",
    "/doc-dev",
    "/apps",
    "/.pytest_cache",
    "/.ruff_cache",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "e2e: browser tests of the Ask CoCo window on the scripted agent (slow; Playwright, Chromium or the installed Edge)",
]
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.uv]
# The development lock covers Python 3.11 and later: Pillow 13 (it fixes the Pillow advisories)
# and filelock 4 need 3.11, and a 3.10 branch kept pillow 12.3.0 in the lock, which Dependabot
# reports. The package itself still declares requires-python >=3.10; only `uv sync` and
# `uv lock` in this repository need 3.11. CI and the release workflow run on 3.11.
# Pyodide (emscripten) is left out: uv 0.13 forks the resolution for it and playwright, which the
# e2e extra needs, has no wheel there, so a fresh `uv sync` (the public CI has no lock) fails.
environments = ["python_full_version >= '3.11' and sys_platform != 'emscripten'"]
# filelock 4.2.1 fixes CVE-2026-112907, -112913 and -112940. snowflake-connector-python 4.8.0
# (via snowflake-cortex-agent-sdk) still says filelock<4, but only uses FileLock, BaseFileLock and Timeout,
# which 4.x keeps. Development lock only: this is not in the wheel's metadata. Drop it once the
# connector allows filelock 4.
override-dependencies = ["filelock>=4.2.1"]

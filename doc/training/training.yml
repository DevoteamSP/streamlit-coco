  - id: understand-what-was-delivered
    title: "Understand what was delivered"
    time: "15 min"
    entry_cost: "nothing to install"
    steps:
      - user-guide/sections/concepts
      - user-guide/sections/reference-examples
    outcome: "you know what streamlit-coco does, what each example app demonstrates, and you can follow a meeting about it."

  - id: use-it
    title: "Build your first CoCo app"
    time: "25 min"
    entry_cost: "a working Python environment"
    steps:
      - user-guide/sections/getting-started

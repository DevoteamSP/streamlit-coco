[project]
name = "app-builder"
version = "0.0.0"
description = "App Builder example (streamlit-coco). Not published to PyPI."
requires-python = ">=3.10"
dependencies = [
    "streamlit-coco",
    "pandas>=2.0",
    "streamlit-extras>=1.3.0",
]

[tool.uv]
# The lock covers Python 3.11 and later (Pillow 13 needs it); see the root pyproject.toml.
environments = ["python_full_version >= '3.11' and sys_platform != 'emscripten'"]

[tool.uv.sources]
streamlit-coco = { path = "../..", editable = true }

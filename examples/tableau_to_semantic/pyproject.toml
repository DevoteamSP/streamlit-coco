[project]
name = "tableau-to-semantic"
version = "0.0.0"
description = "Tableau → Semantic example (streamlit-coco). Not published to PyPI."
requires-python = ">=3.10"
dependencies = [
    "streamlit-coco",
    "pandas>=2.0",
    "streamlit-extras>=1.3.0",
]

[tool.uv.sources]
# Prefer the repo checkout so the example tracks this tree. From 0.1.6, PyPI
# also includes copilot_rail / preview_chars.
streamlit-coco = { path = "../..", editable = true }
